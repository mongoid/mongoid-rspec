name: Test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '2.6', mongodb: '4.4', gemfile: 'mongoid_4', bundler: '1.17.3' }
          - { ruby: '2.6', mongodb: '4.4', gemfile: 'mongoid_5', bundler: '1.17.3' }
          - { ruby: '2.7', mongodb: '4.4', gemfile: 'mongoid_6' }
          - { ruby: '2.7', mongodb: '5.0', gemfile: 'mongoid_7' }
          - { ruby: '2.7', mongodb: '5.0', gemfile: 'mongoid_8' }
          - { ruby: '3.0', mongodb: '6.0', gemfile: 'mongoid_8' }
          - { ruby: '3.1', mongodb: '6.0', gemfile: 'mongoid_8' }
          - { ruby: '3.2', mongodb: '7.0', gemfile: 'mongoid_8' }
          - { ruby: '3.3', mongodb: '7.0', gemfile: 'mongoid_9' }
          - { ruby: '3.4', mongodb: '8.0', gemfile: 'mongoid_9' }
          - { ruby: '4.0', mongodb: '8.0', gemfile: 'mongoid_9' }
    name: test (ruby=${{ matrix.entry.ruby }}, mongodb=${{ matrix.entry.mongodb }}), gemfile=${{ matrix.entry.gemfile }})
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.entry.gemfile }}.gemfile
    steps:
      - name: Set up MongoDB ${{ matrix.entry.mongodb }}
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ matrix.entry.mongodb }}
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.entry.ruby }}
          bundler: ${{ matrix.entry.bundler || 'default' }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake
